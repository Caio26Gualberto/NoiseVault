services:
  postgres:
    image: postgres:17
    container_name: headbanger-postgres
    environment:
      POSTGRES_DB: headbanger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - headbanger-pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: headbanger-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  headbanger-pgdata:
