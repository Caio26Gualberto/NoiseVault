services:
  postgres:
    image: postgres:17
    container_name: noisevault-postgres
    environment:
      POSTGRES_DB: noisevault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - noisevault-pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: noisevault-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"

  localstack:
    image: localstack/localstack:4.14.0
    container_name: noisevault-localstack
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      - "4566:4566"
    volumes:
      - noisevault-localstack:/var/lib/localstack
      - ./infra/localstack/ready.d:/etc/localstack/init/ready.d:ro

volumes:
  noisevault-pgdata:
  noisevault-localstack:
