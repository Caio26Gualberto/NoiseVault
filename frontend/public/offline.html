<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1515" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sem conexão · Noise Vault</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1c1515; color: #f3eae6; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { margin: 0; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; }
      p { margin: 0; max-width: 320px; color: #b9aaa5; line-height: 1.5; }
      button { margin-top: 8px; border: 0; border-radius: 8px; padding: 12px 20px; background: #e53935; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sem conexão</h1>
      <p>O Noise Vault precisa de internet para mostrar o feed, o mural e os shows. Confira a conexão e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
