customHeaders:
  - pattern: '/sw.js'
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: '/manifest.webmanifest'
    headers:
      - key: Content-Type
        value: application/manifest+json
      - key: Cache-Control
        value: no-cache
  - pattern: '/manifest-ensaio.webmanifest'
    headers:
      - key: Content-Type
        value: application/manifest+json
      - key: Cache-Control
        value: no-cache
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: '/assets/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
